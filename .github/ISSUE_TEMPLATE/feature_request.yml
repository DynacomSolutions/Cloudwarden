name: Feature Request
description: Suggest a feature or enhancement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Have an idea for a new feature or enhancement? We'd love to hear it!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
      placeholder: Describe the feature clearly
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature useful?
      placeholder: Explain the use case or problem this solves
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: How might this be implemented?
      placeholder: Any thoughts on implementation (optional)
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Any Bitwarden client compatibility concerns?
      placeholder: Does this affect compatibility with Bitwarden clients?
    validations:
      required: false
