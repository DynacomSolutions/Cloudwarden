[extend]
useDefault = true

[[allowlists]]
description = "pnpm lock file"
paths = ['pnpm-lock\.yaml']

[[allowlists]]
description = "test fixtures"
paths = ['test/fixtures/.*']

# Deliberately fake tokens and keys that the traffic sanitiser tests feed to the sanitiser (TASKS #367).
[[allowlists]]
description = "traffic sanitiser test inputs"
paths = ['''^scripts/traffic-sanitise\.test\.mjs$''', '''^test/traffic-replay\.test\.ts$''']

# The public Secrets Manager access token test vector from the GPL bitwarden-core crate (TASKS #223).
[[allowlists]]
description = "Secrets Manager SDK test vector"
paths = ['''^scripts/sm-client\.test\.mjs$''']


# Vendored web client (TASKS #210): the individual upstream files whose unit test fixtures, spec
# data or public sandbox configuration match generic rules. Listed one by one so that nothing
# Cloudwarden adds under web/ (cloudwarden/ directories included) is ever allowlisted.
[[allowlists]]
description = "vendored web client: named upstream fixture and config files"
paths = [
  '''^web/apps/web/config/base\.json$''',
  '''^web/apps/web/config/cloud\.json$''',
  '''^web/apps/web/config/euprd\.json$''',
  '''^web/apps/web/src/app-id\.json$''',
  '''^web/apps/web/src/app/billing/services/stripe\.service\.spec\.ts$''',
  '''^web/apps/web/src/app/billing/shared/offboarding-survey\.component\.ts$''',
  '''^web/apps/web/src/app/key-management/key-rotation/user-key-rotation\.service\.spec\.ts$''',
  '''^web/libs/auth/src/common/utilities/decode-jwt-token-to-json\.utility\.spec\.ts$''',
  '''^web/libs/common/src/auth/send-access/services/default-send-token\.service\.spec\.ts$''',
  '''^web/libs/common/src/auth/services/token\.service\.spec\.ts$''',
  '''^web/libs/common/src/billing/services/subscription-pricing\.service\.spec\.ts$''',
  '''^web/libs/common/src/enums/feature-flag\.enum\.ts$''',
  '''^web/libs/common/src/key-management/device-trust/services/device-trust\.service\.spec\.ts$''',
  '''^web/libs/common/src/key-management/key-connector/services/key-connector\.service\.spec\.ts$''',
  '''^web/libs/common/src/platform/sync/default-sync\.service\.spec\.ts$''',
  '''^web/libs/common/src/tools/send/models/domain/send\.sdk\.spec\.ts$''',
  '''^web/libs/importer/src/importers/chrome-csv-importer\.spec\.ts$''',
  '''^web/libs/importer/src/importers/keepassx-csv-importer\.spec\.ts$''',
  '''^web/libs/importer/src/importers/onepassword/onepassword-1pux-importer\.spec\.ts$''',
