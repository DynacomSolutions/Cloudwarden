                  connectionToken:
                    type: string
                  negotiateVersion:
                    type: integer
                  availableTransports:
                    type: array
                    items:
                      type: object
                      properties:
                        transport:
                          type: string
                        transferFormats:
                          type: array
                          items:
                            type: string
        '401':
