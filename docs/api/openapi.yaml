# Bitwarden client API contract (OpenAPI 3.1). Generated content; edit by hand from here on.
openapi: 3.1.0
info:
  title: Bitwarden client API contract (Cloudwarden)
  version: 0.1.0
  description: |-
    Wire contract for the Bitwarden client API as called by the official Bitwarden clients (web vault, browser extension, desktop, CLI). It exists so Cloudwarden can be built against a written contract instead of any server implementation.

    **Source of truth.** Every operation records the clients repository release tag it was read from in `x-source-version` and the file in `x-source-file`. The primary tag is `web-v2026.9.1` of github.com/bitwarden/clients. A few calls moved into the Bitwarden SDK (a separate repository) after 2025; those operations cite the older tag where the client still contained the call (`web-v2025.8.0` or `web-v2025.1.0`). Shapes that exist only inside the SDK (the `send_access` grant, enum values for policy types) are flagged in their descriptions.

    **Services and paths.** One base URL serves several services. Official clients derive: API `<base>/api`, identity `<base>/identity`, notifications `<base>/notifications`, icons `<base>/icons`, events `<base>/events`. Paths in this document include that prefix.

    **Casing.** Clients read responses with a case-insensitive lookup (first letter either case, then all lower, then all upper), so servers may emit camelCase or PascalCase. Official servers emit camelCase from the API and PascalCase for the `/identity/connect/token` response members other than the OAuth fields. Request bodies are camelCase JSON, except a few members that are documented explicitly (for example `OTP`, `AttestationObject`).

    **Authentication.** Bearer JWT access token (`Authorization: Bearer ...`). On a 401 the client refreshes the token through `grant_type=refresh_token` and retries once; a second 401 or any 403 on an authenticated call logs the user out. Every request carries `Device-Type`; most carry `Bitwarden-Client-Name` and `Bitwarden-Client-Version`; unauthenticated calls carry `Device-Identifier`.

    **Errors.** API errors use `ErrorResponseModel` (`message`, `validationErrors`, `object: error`). Identity errors use OAuth fields plus `ErrorModel`. HTTP 429 is shown as a rate limit message. Successful empty responses may be 200 or 204; clients treat both as success.

    **Encrypted strings.** Members typed as encrypted strings are opaque `EncString` values (`<type>.<iv>|<data>|<mac>` and later formats). The server never interprets them.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Cloudwarden maintainers
    url: https://github.com/DynacomSolutions/Cloudwarden
  x-source-repository: https://github.com/bitwarden/clients
  x-source-version: web-v2026.9.1
servers:
- url: https://vault.example.org
  description: A Cloudwarden deployment. Replace with your own base URL.
security:
- bearerAuth: []
tags:
- name: Identity
  description: OAuth token endpoint, prelogin and registration. Served under `/identity`.
- name: Accounts
  description: Account profile, keys, password, KDF, verification and deletion. Served under `/api`.
- name: Devices
  description: Known and trusted devices and push registration.
- name: AuthRequests
  description: Login with device and admin approval requests.
- name: Sync
  description: Full vault snapshot.
- name: Ciphers
  description: 'Vault items: CRUD, sharing, trash, bulk operations and import.'
- name: Attachments
  description: Cipher attachments (v2 upload flow).
- name: Folders
  description: Personal folders.
- name: Sends
  description: 'Bitwarden Send: owner management and recipient access.'
- name: Organizations
  description: Organization lifecycle, keys and settings.
- name: OrganizationUsers
  description: Organization membership management.
- name: Collections
  description: Organization collections and access.
- name: Policies
  description: Organization policies.
- name: TwoFactor
  description: Two-factor provider setup and recovery.
- name: Settings
  description: User settings such as equivalent domains.
- name: Config
  description: Server configuration and feature flags.
- name: Events
  description: Event collection and event log reads. Collect is served under `/events`.
- name: Notifications
  description: Real-time push over a SignalR WebSocket hub. Served under `/notifications`.
- name: Icons
  description: Website favicon service. Served under `/icons`.
- name: secrets-manager
  description: 'Secrets Manager: projects, secrets, machine accounts (`service-accounts` on the wire), access tokens, access policies and counts. Read from the GPL-3.0 generated API client in github.com/bitwarden/sdk-internal (`crates/bitwarden-api-api`), see docs/secrets-manager.md. Members need `accessSecretsManager`; machine account tokens are accepted only where stated.'
- name: PublicApi
  description: 'Bitwarden Public API for organizations, served at `/api/public` (self-hosted layout) and `/public` (cloud layout). Authenticated with an organization token (see `organizationToken`). Models follow Bitwarden''s published Public API reference. Used by the Directory Connector (`/public/organization/import`).'
- name: Scim
  description: 'SCIM 2.0 (RFC 7643, RFC 7644) per organization at `/scim/v2/{orgId}` (and `/v2/{orgId}`), for identity providers such as Microsoft Entra ID and Okta. Authenticated with the organization SCIM API key.'
- name: x-cloudwarden
  description: 'Cloudwarden extensions, not part of the Bitwarden API: the admin JSON API under `/api/cloudwarden`. Admin routes need a vault access token whose account address is listed in `ADMIN_EMAILS` with `ADMIN_ENABLED` true, otherwise 403. Responses are `no-store`, camelCase, and rate limited per admin (120 per minute).'
- name: Billing
  description: 'Billing, plans, licences and families sponsorships. Cloudwarden is self-hosted with no payment provider: every organisation has every feature and every account has premium. Reads answer as for an account or organisation without a subscription; changes that need a payment provider or the cloud answer 400.'
- name: Providers
  description: Provider Portal. Providers do not exist on a self-hosted Cloudwarden server; lookups and changes answer 404 and lists are empty.
