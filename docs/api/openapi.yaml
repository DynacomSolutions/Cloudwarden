      operationId: notificationsHubNegotiate
      summary: SignalR negotiate
      description: Not called by the 2026.9 clients (they set skipNegotiation). Defined by the SignalR protocol and listed because the task contract names negotiate; optional for Cloudwarden.
      parameters:
      - name: negotiateVersion
        in: query
        required: false
        schema:
          type: integer
      - name: access_token
        in: query
