  /identity/connect/token:
    post:
      tags:
      - Identity
      operationId: connectToken
      summary: Issue tokens (all grant types)
      description: 'OAuth 2.0 token endpoint. Body is `application/x-www-form-urlencoded; charset=utf-8`. Grants
        used by the clients: `password` (master password hash login), `authorization_code` (SSO, with PKCE), `client_credentials`
        (personal and organization API keys), `webauthn` (passkey login), `refresh_token`, and `send_access` (Send
        access, issued through the SDK). Second factor is supplied by repeating the same request with `twoFactorProvider`,
        `twoFactorToken` and `twoFactorRemember`. Required request headers: `Device-Type`, `Bitwarden-Client-Name`,
        `Bitwarden-Client-Version`; unauthenticated calls also send `Device-Identifier`. Failure modes the client
        distinguishes (all HTTP 400): two-factor required, new device verification required, SSO required, or a
        plain error.'
      parameters:
      - name: Device-Type
        in: header
        required: false
        schema:
          type: string
        description: Decimal DeviceType of the calling client.
      - name: Device-Identifier
        in: header
        required: false
        schema:
          type: string
        description: Per-install device id; sent on unauthenticated calls so the server can target feature flags.
      - name: Bitwarden-Client-Name
        in: header
        required: false
        schema:
          type: string
        description: web, browser, desktop, mobile or cli.
      - name: Bitwarden-Client-Version
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/IdentityTokenResponse'
                - $ref: '#/components/schemas/RefreshTokenResponse'
                - $ref: '#/components/schemas/MachineTokenResponse'
        '400':
          description: Authentication failed or additional step required. Body is one of the listed shapes; see
            the 2FA, device verification and SSO variants.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/IdentityTwoFactorResponse'
                - $ref: '#/components/schemas/IdentityDeviceVerificationResponse'
                - $ref: '#/components/schemas/IdentitySsoRequiredResponse'
                - $ref: '#/components/schemas/IdentityErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-source-version: web-v2026.9.1
      x-source-file: libs/common/src/services/api.service.ts
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - $ref: '#/components/schemas/TokenRequestPassword'
              - $ref: '#/components/schemas/TokenRequestAuthorizationCode'
              - $ref: '#/components/schemas/TokenRequestClientCredentials'
              - $ref: '#/components/schemas/TokenRequestWebAuthn'
              - $ref: '#/components/schemas/TokenRequestRefresh'
              - $ref: '#/components/schemas/TokenRequestSendAccess'
              discriminator:
                propertyName: grant_type
                mapping:
                  password: '#/components/schemas/TokenRequestPassword'
                  authorization_code: '#/components/schemas/TokenRequestAuthorizationCode'
                  client_credentials: '#/components/schemas/TokenRequestClientCredentials'
                  webauthn: '#/components/schemas/TokenRequestWebAuthn'
                  refresh_token: '#/components/schemas/TokenRequestRefresh'
                  send_access: '#/components/schemas/TokenRequestSendAccess'
