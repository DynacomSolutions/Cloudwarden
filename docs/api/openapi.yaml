components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/identity/connect/token`.
    sendAccessToken:
      type: http
      scheme: bearer
      description: Send access token from the `send_access` grant (not the user token).
    hubAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: User access token passed as a query parameter on the WebSocket upgrade.
  responses:
    BadRequest:
      description: Validation or business rule failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    Unauthorized:
      description: Missing, invalid or expired access token. Clients refresh once, then sign out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    Forbidden:
      description: Authenticated but not allowed. On an authenticated call the client signs the user out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    TooManyRequests:
      description: Rate limited. Clients show a generic rate limit message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
  schemas:
    ApiKeyResponse:
      type: object
      properties:
        apiKey:
          type: string
        revisionDate:
          type: string
          format: date-time
      required:
      - apiKey
    AssertionOptions:
      type: object
      description: WebAuthn PublicKeyCredentialRequestOptions JSON.
      properties:
        challenge:
          type: string
        timeout:
          type:
          - integer
          - 'null'
        rpId:
          type:
          - string
          - 'null'
        allowCredentials:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: true
        userVerification:
          type:
          - string
          - 'null'
        extensions:
          type:
          - object
          - 'null'
          additionalProperties: true
      additionalProperties: true
    AttachmentRequest:
      type: object
      properties:
        fileName:
          $ref: '#/components/schemas/EncString'
        key:
          $ref: '#/components/schemas/EncString'
        fileSize:
          type: integer
        adminRequest:
          type:
          - boolean
          - 'null'
        lastKnownRevisionDate:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - fileName
      - key
      - fileSize
    AttachmentResponse:
      type: object
      properties:
        id:
          type: string
        url:
          type:
          - string
          - 'null'
        fileName:
          oneOf:
          - $ref: '#/components/schemas/EncString'
          - type: 'null'
        key:
          oneOf:
          - $ref: '#/components/schemas/EncString'
          - type: 'null'
        size:
          type:
          - string
          - integer
          description: Byte size, serialised as a string by official servers.
        sizeName:
          type:
          - string
          - 'null'
        object:
          type: string
      required:
      - id
    AttachmentUploadDataResponse:
      type: object
      properties:
        attachmentId:
          type: string
        url:
          type: string
        fileUploadType:
          $ref: '#/components/schemas/FileUploadType'
        cipherResponse:
          oneOf:
          - $ref: '#/components/schemas/CipherResponse'
          - type: 'null'
        cipherMiniResponse:
          oneOf:
          - $ref: '#/components/schemas/CipherResponse'
          - type: 'null'
        object:
          type: string
      required:
      - attachmentId
      - url
      - fileUploadType
    AuthRequestCreate:
      type: object
      properties:
        email:
          type: string
        deviceIdentifier:
          type: string
        publicKey:
          type: string
        type:
          $ref: '#/components/schemas/AuthRequestType'
        accessCode:
          type: string
      required:
      - email
      - deviceIdentifier
      - publicKey
      - type
      - accessCode
    AuthRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicKey:
          type: string
        requestDeviceType:
          type: string
        requestDeviceTypeValue:
          $ref: '#/components/schemas/DeviceType'
        requestDeviceIdentifier:
          type: string
        requestIpAddress:
          type: string
        requestCountryName:
          type:
          - string
          - 'null'
        key:
          type:
          - string
          - 'null'
        masterPasswordHash:
          type:
          - string
          - 'null'
        creationDate:
          type: string
          format: date-time
        requestApproved:
          type:
          - boolean
          - 'null'
        responseDate:
          type:
          - string
          - 'null'
          format: date-time
        isAnswered:
          type: boolean
        isExpired:
          type: boolean
        origin:
