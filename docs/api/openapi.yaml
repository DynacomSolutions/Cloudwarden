components:
  securitySchemes:
    organizationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Organization token from `/identity/connect/token` with `grant_type=client_credentials`, `client_id=organization.<id>`, `scope=api.organization` and the organization API key as `client_secret`. Rotating the key revokes earlier tokens.
    scimKey:
      type: http
      scheme: bearer
      description: The organization SCIM API key (`api-key` type 2), sent as a Bearer token. SCIM must be enabled for the organization.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/identity/connect/token`.
    sendAccessToken:
      type: http
      scheme: bearer
      description: Send access token from the `send_access` grant (not the user token).
    hubAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: User access token passed as a query parameter on the WebSocket upgrade.
  responses:
    PublicBadRequest:
      description: Validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicErrorResponse'
    PublicUnauthorized:
      description: Missing, invalid or revoked organization token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicErrorResponse'
    PublicNotFound:
      description: Not found in this organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicErrorResponse'
    ScimBadRequest:
      description: Invalid request (scimType invalidFilter, invalidPath, invalidValue, invalidSyntax or noTarget).
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimUnauthorized:
      description: SCIM disabled, or a missing or wrong SCIM API key.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimNotFound:
      description: Resource not found.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimConflict:
      description: A user or group with that identity exists (scimType uniqueness).
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    BadRequest:
      description: Validation or business rule failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    Unauthorized:
      description: Missing, invalid or expired access token. Clients refresh once, then sign out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    Forbidden:
      description: Authenticated but not allowed. On an authenticated call the client signs the user out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
    TooManyRequests:
      description: Rate limited. Clients show a generic rate limit message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseModel'
