  /notifications/hub:
    get:
      tags:
      - Notifications
      operationId: notificationsHub
      summary: Open the notifications WebSocket (SignalR)
      description: 'The clients connect with `skipNegotiation: true` and `HttpTransportType.WebSockets`, so a plain
        WebSocket upgrade is the only required path. After the upgrade: client sends the SignalR handshake (`{"protocol":"messagepack","version":1}`
        followed by the 0x1e record separator), then the server invokes `ReceiveMessage` with a `NotificationMessage`
        and `Heartbeat` (no arguments) over MessagePack frames. Clients reconnect after a random 2 to 5 minute delay.'
      parameters:
      - name: access_token
        in: query
        required: true
        schema:
          type: string
        description: Access token; browsers cannot set headers on a WebSocket.
      responses:
        '101':
          description: Switching Protocols. WebSocket carrying the SignalR hub protocol with MessagePack encoding.
          content:
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/NotificationMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - hubAccessToken: []
      x-source-version: web-v2026.9.1
      x-source-file: libs/common/src/platform/server-notifications/internal/signalr-connection.service.ts
