<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Cloudwarden architecture</title>
  <desc id="desc">Bitwarden-compatible clients encrypt vault data before sending it to a Cloudflare Worker. The Worker stores relational data in D1, file attachments and Sends in R2, and uses a Durable Object for live sync notifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d0f"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1e21"/><stop offset="1" stop-color="#121416"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ef656b"/><stop offset="1" stop-color="#e8414a"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e8414a"/></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#777d82"/></marker>
    <style>
      text{font-family:Montserrat,Inter,Arial,sans-serif;fill:#f5f5f5}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:2.2px;fill:#e8414a}
      .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}
      .body{font-size:15px;fill:#b7bcc0}
      .small{font-size:13px;fill:#989ea3}
      .node{fill:url(#panel);stroke:#33383c;stroke-width:1.5}
      .line{fill:none;stroke:#e8414a;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#777d82;stroke-width:2;stroke-dasharray:7 8;marker-end:url(#arrow-muted)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1185" cy="145" r="150" fill="#e8414a" opacity=".055" filter="url(#glow)"/>
  <path d="M0 190H1440" stroke="#282c30"/>
  <text x="64" y="73" class="eyebrow">CLOUDWARDEN / UNDER THE HOOD</text>
  <text x="64" y="125" font-size="37" font-weight="700" letter-spacing="-1.2">Encrypted in the client. Stored in your stack.</text>
  <text x="66" y="159" class="body">A clear view of how the web vault, API and Cloudflare storage fit together.</text>

  <rect x="58" y="250" width="320" height="330" rx="22" class="node"/>
  <rect x="82" y="276" width="111" height="27" rx="13.5" fill="#322124"/>
  <text x="99" y="294" class="eyebrow" font-size="11">CLIENT SIDE</text>
  <text x="82" y="344" class="heading">Your Bitwarden clients</text>
  <text x="82" y="374" class="body">Web · desktop · mobile · CLI</text>
  <g transform="translate(83 409)" fill="none" stroke="#e8414a" stroke-width="2">
    <rect x="0" y="8" width="34" height="28" rx="7"/><path d="M9 8V3a8 8 0 0 1 16 0v5"/><circle cx="17" cy="21" r="2" fill="#e8414a"/><path d="M17 23v5"/>
  </g>
  <text x="135" y="427" font-size="16" font-weight="700">Encrypt before upload</text>
  <text x="135" y="451" class="small">Vault data stays encrypted.</text>
  <path d="M82 475H354" stroke="#34393d"/>
  <circle cx="91" cy="511" r="4" fill="#e8414a"/><text x="108" y="516" class="body">Encrypted vault fields</text>
  <circle cx="91" cy="547" r="4" fill="#e8414a"/><text x="108" y="552" class="body">Requests and sync</text>

  <rect x="522" y="250" width="350" height="330" rx="22" fill="url(#panel)" stroke="#e8414a" stroke-width="2"/>
  <path d="M544 251H850" stroke="url(#coral)" stroke-width="4" stroke-linecap="round"/>
  <rect x="550" y="276" width="154" height="27" rx="13.5" fill="#322124"/>
  <text x="567" y="294" class="eyebrow" font-size="11">CLOUDFLARE</text>
  <text x="550" y="344" class="heading">Cloudwarden Worker</text>
  <text x="550" y="374" class="body">Hono API · auth · sync · policy</text>
  <path d="M550 398H844" stroke="#34393d"/>
  <text x="550" y="434" class="small">Receives and returns encrypted vault fields</text>
  <text x="550" y="458" class="small">alongside account and sharing metadata.</text>
  <rect x="550" y="489" width="93" height="36" rx="10" fill="#24282b"/><text x="570" y="512" font-size="13" font-weight="700">/identity</text>
  <rect x="652" y="489" width="63" height="36" rx="10" fill="#24282b"/><text x="669" y="512" font-size="13" font-weight="700">/api</text>
  <rect x="724" y="489" width="119" height="36" rx="10" fill="#24282b"/><text x="740" y="512" font-size="13" font-weight="700">/notifications</text>
  <text x="550" y="554" class="small">The Worker does not decrypt vault contents.</text>

  <rect x="1030" y="216" width="350" height="132" rx="20" class="node"/>
  <rect x="1052" y="238" width="36" height="36" rx="11" fill="#322124"/>
  <path d="M1061 248h18v16h-18zM1065 244h10" stroke="#ef656b" stroke-width="2" fill="none"/>
  <text x="1103" y="260" class="heading">D1</text>
  <text x="1052" y="300" class="body">Accounts, relationships and opaque</text>
  <text x="1052" y="323" class="body">encrypted vault values</text>

  <rect x="1030" y="379" width="350" height="132" rx="20" class="node"/>
  <rect x="1052" y="401" width="36" height="36" rx="11" fill="#322124"/>
  <path d="M1060 410h20v17h-20zM1064 406h12v4" stroke="#ef656b" stroke-width="2" fill="none"/>
  <text x="1103" y="423" class="heading">R2</text>
  <text x="1052" y="463" class="body">Attachment and file-Send blobs</text>
  <text x="1052" y="486" class="small">D1 keeps their metadata</text>

  <rect x="1030" y="542" width="350" height="132" rx="20" class="node"/>
  <rect x="1052" y="564" width="36" height="36" rx="11" fill="#322124"/>
  <circle cx="1064" cy="581" r="4" fill="none" stroke="#ef656b" stroke-width="2"/><circle cx="1078" cy="575" r="4" fill="none" stroke="#ef656b" stroke-width="2"/><circle cx="1078" cy="588" r="4" fill="none" stroke="#ef656b" stroke-width="2"/><path d="m1068 579 6-3m-6 7 6 4" stroke="#ef656b" stroke-width="2"/>
  <text x="1103" y="586" class="heading">NotificationHub</text>
  <text x="1052" y="626" class="body">Durable Object for live-sync fan-out</text>
  <text x="1052" y="649" class="small">WebSocket connections, not vault storage</text>

  <path d="M378 414H510" class="line"/>
  <text x="392" y="396" class="small">HTTPS</text>
  <path d="M872 343C935 343 936 282 1012 282" class="line"/>
  <path d="M872 414H1012" class="line"/>
  <path d="M872 487C935 487 936 608 1012 608" class="line"/>
  <path d="M1030 637C956 718 418 718 306 586" class="return"/>
  <rect x="553" y="682" width="207" height="34" rx="17" fill="#171a1d" stroke="#363b3f"/>
  <text x="577" y="704" class="small">Live updates over WebSocket</text>
  <text x="64" y="723" class="small">Deployment, backups and account settings are operated by the instance owner.</text>
</svg>
