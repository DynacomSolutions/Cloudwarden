glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,json}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    identifiers:
      run: node scripts/check-identifiers.mjs --staged
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact
        else
          echo "gitleaks not installed, skipping (CI still enforces)"
          exit 0
        fi
    author:
      run: node scripts/check-identifiers.mjs --check-author

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      glob: ["**/*.{ts,tsx,js,mjs,cjs,json,sql,toml}", "pnpm-lock.yaml"]
      run: pnpm typecheck
    test:
      glob: ["**/*.{ts,tsx,js,mjs,cjs,json,sql,toml}", "pnpm-lock.yaml"]
      run: pnpm exec vitest run --changed origin/main --passWithNoTests --maxWorkers=2 --testTimeout=240000 --hookTimeout=240000
    test-scripts:
      glob: ["**/*.{ts,tsx,js,mjs,cjs,json,sql,toml}", "pnpm-lock.yaml"]
      run: pnpm test:scripts
