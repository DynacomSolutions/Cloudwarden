appId: com.8bit.bitwarden
---
- runFlow: _login.yaml
# Folder (Settings, Vault, Folders).
- tapOn: "Settings"
- tapOn: "Vault"
- tapOn: "Folders"
- tapOn:
    id: "AddItemFloatingActionButton"
- tapOn: "Name.*"
- inputText: Example folder
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Example folder"
    timeout: 15000
- tapOn: "Example folder"
- tapOn: "Name.*"
- eraseText: 30
- inputText: Example folder renamed
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Example folder renamed"
    timeout: 15000
- tapOn: "My vault"
# Login item: create, edit, trash, restore, trash, delete for good.
- tapOn:
    id: "AddItemFloatingActionButton"
- tapOn: "Login"
- runFlow:
    when:
      visible: "Password autofill"
    commands:
      - tapOn: "OK"
- tapOn:
    id: "ItemNameEntry"
- inputText: Example login
- takeScreenshot: 1-name
- tapOn:
    id: "LoginUsernameEntry"
- inputText: alice
- takeScreenshot: 2-username
- tapOn:
    id: "LoginPasswordEntry"
- inputText: p4ssw0rd!
- takeScreenshot: 3-password
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Login"
    timeout: 20000
- tapOn: "Login"
- tapOn: "Example login.*"
- takeScreenshot: 4-view
- tapOn: "Edit"
- takeScreenshot: 5-edit
- assertVisible: "NEVER_PRESENT_PROBE_END"
