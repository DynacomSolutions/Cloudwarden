appId: com.8bit.bitwarden
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- tapOn: "Log in"
- extendedWaitUntil:
    visible:
      id: "LoginEmailAddressEntry"
    timeout: 30000
- runFlow: _self-hosted.yaml
- tapOn:
    id: "CreateAccountButton"
- tapOn:
    id: "EmailAddressEntry"
- inputText: ${EMAIL}
- tapOn:
    id: "NameEntry"
- inputText: Example User
- tapOn:
    id: "ContinueButton"
- extendedWaitUntil:
    visible:
      id: "MasterPasswordEntry"
    timeout: 120000
- tapOn:
    id: "MasterPasswordEntry"
- inputText: ${PASSWORD}
- tapOn:
    text: "Choose your master password"
    optional: true
- scrollUntilVisible:
    element: "Re-type master password.*"
- waitForAnimationToEnd
- tapOn: "Re-type master password.*"
- inputText: ${PASSWORD}
- tapOn:
    text: "Choose your master password"
    optional: true
- scrollUntilVisible:
    element: "Master password hint"
- waitForAnimationToEnd
- tapOn: "Master password hint"
- inputText: example hint
- tapOn:
    text: "Choose your master password"
    optional: true
# Do not send the password to a breach checking service outside the capture.
- scrollUntilVisible:
    element: "Check known data breaches for this password"
- waitForAnimationToEnd
- tapOn:
    id: "CheckExposedMasterPasswordToggle"
- scrollUntilVisible:
    element:
      id: "CreateAccountButton"
- tapOn:
    id: "CreateAccountButton"
- runFlow: _reach-vault.yaml
- waitForAnimationToEnd:
    timeout: 3000
