appId: com.8bit.bitwarden
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- tapOn: "Log in"
- extendedWaitUntil:
    visible:
      id: "LoginEmailAddressEntry"
    timeout: 30000
- runFlow: _self-hosted.yaml
- tapOn:
    id: "CreateAccountButton"
- tapOn:
    id: "EmailAddressEntry"
- inputText: ${EMAIL}
- tapOn:
    id: "NameEntry"
- inputText: Example User
- tapOn:
    id: "ContinueButton"
- extendedWaitUntil:
    visible:
      id: "MasterPasswordEntry"
    timeout: 120000
# Fields lower on the page sit behind the keyboard once it is up, and a tap there hits the
# keys instead: scroll the form up first so every field is above the keyboard.
- swipe:
    start: 50%, 80%
    end: 50%, 25%
- waitForAnimationToEnd
- tapOn:
    id: "MasterPasswordEntry"
- inputText: ${PASSWORD}
- tapOn: "Master password hint"
- inputText: example hint
- tapOn: "Re-type master password.*"
- inputText: ${PASSWORD}
# Do not send the password to a breach checking service outside the capture.
- tapOn:
    id: "CheckExposedMasterPasswordToggle"
- takeScreenshot: filled
- tapOn:
    id: "CreateAccountButton"
- runFlow: _reach-vault.yaml
- waitForAnimationToEnd:
    timeout: 3000
