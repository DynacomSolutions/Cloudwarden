appId: com.8bit.bitwarden
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- tapOn: "Log in"
- extendedWaitUntil:
    visible:
      id: "LoginEmailAddressEntry"
    timeout: 30000
- runFlow: _self-hosted.yaml
- tapOn:
    id: "CreateAccountButton"
- tapOn:
    id: "EmailAddressEntry"
- inputText: ${EMAIL}
- tapOn:
    id: "NameEntry"
- inputText: Example User
- tapOn:
    id: "ContinueButton"
- extendedWaitUntil:
    visible:
      id: "MasterPasswordEntry"
    timeout: 120000
# A tap on another field is ignored while the keyboard is up, so each field is followed by the
# Return key, which dismisses it.
- tapOn:
    id: "MasterPasswordEntry"
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn: "Re-type master password.*"
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn: "Master password hint"
- inputText: example hint
- pressKey: Enter
# Do not send the password to a breach checking service outside the capture.
- tapOn:
    id: "CheckExposedMasterPasswordToggle"
- tapOn:
    id: "CreateAccountButton"
- runFlow: _reach-vault.yaml
- waitForAnimationToEnd:
    timeout: 3000
