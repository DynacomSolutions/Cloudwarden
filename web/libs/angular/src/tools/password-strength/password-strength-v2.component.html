<bit-progress-bar [variant]="color" [hideStartHint]="!showText || !text" [value]="scoreWidth">
  <bit-hint slot="start">{{ text }}</bit-hint>
</bit-progress-bar>

<div aria-live="polite" class="tw-sr-only">
  <!-- Without a score `text` is null, which would leave the raw "__$1__" placeholder in the label. -->
  @if (text) {
    {{ "passwordStrengthScore" | i18n: text }}
  }
</div>
